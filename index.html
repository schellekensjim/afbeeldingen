<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afbeeldingen downloaden</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c1f24; --muted: #6b7280;
    --accent: #2563eb; --accent-hover: #1d4ed8; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1e24; --text: #eef0f3; --muted: #9aa3af; --border: #2a303a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 32px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .sub { color: var(--muted); margin: 0; }
  .bar { max-width: 1100px; margin: 16px auto 0; padding: 0 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .bar input[type=search] { flex: 1 1 220px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1rem; }
  button, .btn { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px; font-size: .95rem; background: var(--accent); color: #fff; text-decoration: none; display: inline-block; text-align: center; }
  button:hover, .btn:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--card); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .thumb { aspect-ratio: 4/3; background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .err { color: var(--muted); font-size: .85rem; padding: 8px; text-align: center; }
  .info { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .name { font-weight: 600; word-break: break-word; }
  .info button { margin-top: auto; }
  .msg { text-align: center; color: var(--muted); padding: 40px 16px; }
  .msg textarea { width: 100%; max-width: 640px; height: 140px; margin-top: 12px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: ui-monospace, monospace; }
  .msg .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Afbeeldingen</h1>
  <p class="sub" id="count">Laden…</p>
</header>

<div class="bar">
  <input type="search" id="search" placeholder="Zoek op naam…" aria-label="Zoeken">
  <button id="all" class="secondary" title="Download alle zichtbare afbeeldingen">Alles downloaden</button>
  <button id="load" class="secondary">Ander bestand laden</button>
  <input type="file" id="file" accept=".txt,text/plain" class="hidden">
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="msg hidden" id="fallback">
    <p>Het bestand <b>afbeeldingsnamen.txt</b> kon niet automatisch worden geladen.<br>
    Dit gebeurt als je de pagina direct vanaf je computer opent. Kies het bestand of plak de inhoud hieronder.</p>
    <div class="row"><button id="pick">Bestand kiezen</button></div>
    <textarea id="paste" placeholder="naam afbeelding = https://voorbeeld.nl/plaatje.jpg"></textarea>
    <div class="row"><button id="usePaste">Toon afbeeldingen</button></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let items = [];

function parse(text) {
  return text.split(/\r?\n/).map(l => l.trim())
    .filter(l => l && !l.startsWith('#'))
    .map(l => {
      const i = l.indexOf('=');
      if (i < 1) return null;
      const name = l.slice(0, i).trim();
      const url = l.slice(i + 1).trim();
      return name && url ? { name, url } : null;
    }).filter(Boolean);
}

function extFromUrl(url) {
  try {
    const m = new URL(url, location.href).pathname.match(/\.([a-z0-9]{2,5})$/i);
    return m ? m[1].toLowerCase() : '';
  } catch { return ''; }
}

function safeName(name) {
  return name.replace(/[\\/:*?"<>|]+/g, '_').trim() || 'afbeelding';
}

async function download(item, btn) {
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Bezig…'; }
  try {
    const res = await fetch(item.url);
    if (!res.ok) throw new Error(res.status);
    const blob = await res.blob();
    let ext = extFromUrl(item.url);
    if (!ext) ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').split('+')[0];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = safeName(item.name) + '.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) {
    // Fallback als de server directe downloads blokkeert (CORS): open in nieuw tabblad
    const a = document.createElement('a');
    a.href = item.url; a.download = safeName(item.name);
    a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

function visible() {
  const q = $('search').value.trim().toLowerCase();
  return items.filter(i => i.name.toLowerCase().includes(q));
}

function render() {
  const list = visible();
  $('count').textContent = items.length
    ? `${list.length} van ${items.length} afbeelding${items.length === 1 ? '' : 'en'}`
    : 'Geen afbeeldingen gevonden';
  const grid = $('grid');
  grid.innerHTML = '';
  list.forEach(item => {
    const card = document.createElement('div'); card.className = 'card';
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    const img = document.createElement('img');
    img.loading = 'lazy'; img.alt = item.name; img.src = item.url;
    img.onerror = () => { thumb.innerHTML = '<div class="err">Voorbeeld niet beschikbaar</div>'; };
    thumb.appendChild(img);
    const info = document.createElement('div'); info.className = 'info';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = item.name;
    const btn = document.createElement('button'); btn.textContent = 'Downloaden';
    btn.onclick = () => download(item, btn);
    info.append(name, btn);
    card.append(thumb, info);
    grid.appendChild(card);
  });
}

function setItems(text) {
  items = parse(text);
  $('fallback').classList.add('hidden');
  render();
}

async function init() {
  try {
    const res = await fetch('afbeeldingsnamen.txt', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    setItems(await res.text());
  } catch {
    $('count').textContent = 'Bestand niet geladen';
    $('fallback').classList.remove('hidden');
  }
}

$('search').addEventListener('input', render);
$('all').onclick = async () => {
  for (const item of visible()) { await download(item); await new Promise(r => setTimeout(r, 400)); }
};
const openPicker = () => $('file').click();
$('load').onclick = openPicker;
$('pick').onclick = openPicker;
$('file').onchange = async e => { const f = e.target.files[0]; if (f) setItems(await f.text()); };
$('usePaste').onclick = () => setItems($('paste').value);

init();
</script>
</body>
</html>
